[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synctrl"
version = "0.1.0"
description = "Independent, simulation-only investigation of arXiv 2610.31275 (synthetic control priors for robot action prediction)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
